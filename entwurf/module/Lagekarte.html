<!doctype html>
<html lang="de" data-thema="hell">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Module · Lagekarte</title>
<link rel="stylesheet" href="../../statisch/schriften.css">
<style>
/* Entwurf „Module / Lagekarte“ — Werkbank-Palette, Werte gespiegelt aus
   frontend/src/stil/farben.css. Neu sind nur die acht Thementöne (--f1…--f8
   als Fläche, --t1…--t8 als Ton); kommt das Modul, wandern sie dorthin.

   Grundsatz der Karte: **Die Fläche sagt, wohin etwas gehört, die Kante, wie
   es steht.** Zwei Fragen, zwei Kanäle — sonst liest man Grün als „erledigt“,
   obwohl es nur „Pilotpatient“ heißt. */
:root {
  color-scheme: light;
  --grund:#fafaf7; --flaeche:#fff; --flaeche-leise:#f3f2ec; --rand:#d2ccbc; --rand-stark:#b0aa99;
  --text:#171a18; --text-leise:#565c58; --text-sehr-leise:#69706b;
  --marke:#0d4e52; --marke-hell:#e4eeed; --akzent:#a2552c; --akzent-hell:#f8ede5;
  --kopf-grund:#0b2a2c; --kopf-text:#e4edec; --kopf-text-leise:#94b3b2; --kopf-aktiv:#123a3d; --kopf-kante:#d98c5c; --kopf-rand:#1b4a4d;
  --gut:#3d6b44; --gut-hell:#e7efe6; --warnung:#963d22; --warnung-hell:#fae8e0;
  --wartend:#5c4a70; --wartend-hell:#eee9f2; --auf-akzent:#fff;
  /* Thementöne: Fläche (Text --text darauf ≥ 13:1) und Ton (Weiß darauf ≥ 5,4:1). */
  --f1:#e6edf6; --t1:#2f5e8c;   /* Blau    */
  --f2:#f6edd8; --t2:#7f5c10;   /* Ocker   */
  --f3:#f5e5e9; --t3:#8c3a52;   /* Beere   */
  --f4:#eaeedb; --t4:#52611c;   /* Oliv    */
  --f5:#efe8e2; --t5:#6d5444;   /* Ton     */
  --f6:#e1eef0; --t6:#2b606b;   /* Petrol  */
  --f7:#eee6f1; --t7:#6b3f78;   /* Pflaume */
  --f8:#e7e9ee; --t8:#4a5263;   /* Schiefer*/
  --auf-ton:#fff;
  --kante:2px; --griff:44px;
  --schrift:Archivo,"Helvetica Neue",system-ui,-apple-system,sans-serif;
  --schrift-zahl:"IBM Plex Mono",ui-monospace,monospace;
}
[data-thema="dunkel"] {
  color-scheme: dark;
  --grund:#14171a; --flaeche:#1c2124; --flaeche-leise:#23292c; --rand:#303739; --rand-stark:#4a5255;
  --text:#eceeec; --text-leise:#a9b1ae; --text-sehr-leise:#8c9491;
  --marke:#66b9b6; --marke-hell:#16302f; --akzent:#d98c5c; --akzent-hell:#2c2019;
  --kopf-grund:#0a2224; --kopf-aktiv:#103134; --kopf-rand:#17474b;
  --gut:#86b37d; --gut-hell:#1b281c; --warnung:#de8a6c; --warnung-hell:#31201a;
  --wartend:#ac9bc2; --wartend-hell:#241f2e; --auf-akzent:#1c1410;
  --f1:#1b2530; --t1:#86acd4;
  --f2:#2a2416; --t2:#d4af62;
  --f3:#2e1d23; --t3:#db90a6;
  --f4:#22271a; --t4:#afc175;
  --f5:#2a2320; --t5:#c7a58e;
  --f6:#182629; --t6:#7fb8c4;
  --f7:#271e2b; --t7:#bd96cb;
  --f8:#202329; --t8:#a8b0c2;
  --auf-ton:#14171a;
}

* { box-sizing:border-box; }
html, body { height:100%; margin:0; }
body { font:14px/1.4 var(--schrift); color:var(--text); background:var(--grund); -webkit-font-smoothing:antialiased; overflow:hidden; }
button, input, textarea, select { font:inherit; color:inherit; }
.zahl { font-family:var(--schrift-zahl); font-size:.92em; }
kbd { font:500 11px/1 var(--schrift-zahl); padding:3px 5px; border:1px solid var(--rand); border-radius:2px; background:var(--flaeche); color:var(--text-leise); }

.app { display:grid; grid-template-rows:auto 1fr; height:100vh; height:100dvh; }

/* Leiste — in beiden Themen dunkel, daher nur --kopf-*-Töne */
.leiste { display:flex; align-items:center; gap:12px; min-height:56px; padding:env(safe-area-inset-top) max(12px, env(safe-area-inset-right)) 0 max(16px, env(safe-area-inset-left)); background:var(--kopf-grund); color:var(--kopf-text); }
.leiste img { width:22px; height:22px; display:block; }
.pfad { font-size:13.5px; color:var(--kopf-text-leise); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.pfad b { color:var(--kopf-text); font-weight:600; }
.leiste .rechts { margin-left:auto; display:flex; gap:4px; }
.lk { min-height:var(--griff); min-width:var(--griff); padding:0 12px; border:1px solid transparent; background:none; color:var(--kopf-text-leise); border-radius:2px; cursor:pointer; font-size:13px; }
.lk:hover { background:var(--kopf-aktiv); color:var(--kopf-text); }

.werk { display:grid; grid-template-columns:minmax(0,1fr) 344px; min-height:0; }

/* Bühne: unendliche Fläche mit Punktraster, das mitwandert */
.buehne { position:relative; overflow:hidden; touch-action:none; cursor:grab; background:var(--grund); user-select:none; -webkit-user-select:none; }
.buehne.zieht { cursor:grabbing; }
.raster { position:absolute; inset:0; pointer-events:none; background-image:radial-gradient(circle at 1px 1px, var(--rand) 1.1px, transparent 1.4px); }
.welt { position:absolute; left:0; top:0; transform-origin:0 0; }
#linien { position:absolute; left:0; top:0; width:1px; height:1px; overflow:visible; pointer-events:none; }

/* Linien: Dicke bleibt beim Zoomen gleich */
.l { fill:none; vector-effect:non-scaling-stroke; transition:opacity .25s; }
.l-stamm { stroke:var(--t); stroke-width:3; opacity:.55; }
.l-ast { stroke:var(--t); stroke-width:2; opacity:.45; }
.l-folgt { stroke:var(--text-sehr-leise); stroke-width:1.5; }
.l-erfuellt { stroke:var(--gut); stroke-width:1.5; }
.l-kreuz { stroke:var(--akzent); stroke-width:2; stroke-dasharray:7 6; animation:fluss .9s linear infinite; }
.l-neu { stroke:var(--akzent); stroke-width:2; stroke-dasharray:3 5; }
.lp-folgt { fill:var(--text-sehr-leise); } .lp-erfuellt { fill:var(--gut); } .lp-kreuz, .lp-neu { fill:var(--akzent); }
.lt { fill:var(--text-leise); font-family:var(--schrift); font-weight:600; paint-order:stroke; stroke:var(--grund); stroke-linejoin:round; }
.lt-kreuz { fill:var(--akzent); }
#linien .leise { opacity:.12; }
@keyframes fluss { to { stroke-dashoffset:-13; } }

/* Bänder der Strang-Ansicht */
.band { position:absolute; background:var(--f); opacity:.45; border-top:1px solid var(--rand); transition:opacity .35s; pointer-events:none; }
.band span { position:absolute; left:16px; top:10px; font-size:12px; font-weight:600; color:var(--text-leise); }
[data-ansicht="stern"] .band, [data-stufe="lage"] .band { opacity:0; }

/* Die Mitte */
.mitte { position:absolute; transform:translate(-50%,-50%) scale(var(--g,1)); display:flex; align-items:center; gap:10px; padding:0 18px; height:72px; min-width:190px; background:var(--kopf-grund); color:var(--kopf-text); border-radius:2px; border-bottom:3px solid var(--kopf-kante); font-weight:700; font-size:17px; letter-spacing:-.02em; cursor:default; }
.mitte img { width:28px; height:28px; }
.mitte small { display:block; font:500 11px/1.2 var(--schrift); color:var(--kopf-text-leise); letter-spacing:0; }

/* Themen-Knoten (Hub): voller Ton, weiße Schrift */
.hub { position:absolute; width:220px; transform:translate(-50%,-50%) scale(var(--g,1)); padding:10px 12px 11px; background:var(--t); color:var(--auf-ton); border-radius:2px; cursor:pointer; transition:opacity .25s; }
.hub-kopf { display:flex; align-items:baseline; gap:8px; }
.hub-name { font-weight:700; font-size:15px; letter-spacing:-.01em; outline:none; min-width:2ch; }
.hub-zahl { margin-left:auto; font:500 12px var(--schrift-zahl); opacity:.9; }
.hub-balken { display:flex; gap:3px; margin-top:8px; height:6px; }
.hub-balken i { flex:1; border:1px solid currentColor; opacity:.55; }
.hub-balken i[data-s="laeuft"] { background:currentColor; opacity:.7; }
.hub-balken i[data-s="wartet"] { border-style:dashed; opacity:.9; }
.hub-balken i[data-s="erledigt"] { background:currentColor; opacity:1; }
.hub-lage { list-style:none; margin:8px 0 0; padding:0; font-size:12.5px; line-height:1.35; display:none; }
.hub-lage li { display:flex; gap:7px; align-items:baseline; padding:2px 0; }
.hub-lage li::before { content:""; flex:0 0 7px; height:7px; border:1.5px solid currentColor; transform:translateY(-1px); }
.hub-lage li[data-s="laeuft"]::before { background:currentColor; }
.hub-lage li[data-s="wartet"]::before { border-style:dashed; }
.hub-lage li[data-s="kreuz"] { font-weight:600; }
.hub-lage li[data-s="kreuz"]::before { border-radius:50%; background:currentColor; }
.hub-lage li.leer { opacity:.8; font-style:italic; }
.hub-lage li.leer::before { display:none; }
[data-stufe="lage"] .hub-lage { display:block; }
.hub.ziel, .mitte.ziel { outline:3px solid var(--akzent); outline-offset:4px; }

/* Schritt-Knoten: Fläche = Thema, Kante = Status */
.k { position:absolute; width:200px; min-height:48px; transform:translate(-50%,-50%); padding:9px 12px 10px 34px; background:var(--f); border:2px solid var(--rand-stark); border-radius:2px; cursor:pointer; transition:opacity .3s, border-color .2s; }
.k[data-status="laeuft"] { border-color:var(--marke); }
.k[data-status="wartet"] { border-color:var(--wartend); border-style:dashed; }
.k[data-status="erledigt"] { border-color:var(--gut); }
.k[data-status="erledigt"] .k-titel { color:var(--text-leise); }
.k.gesperrt { opacity:.62; }
.k-titel { display:block; font-weight:600; font-size:14px; line-height:1.3; outline:none; word-break:break-word; }
.k-titel:empty::before { content:"Gedanke …"; color:var(--text-sehr-leise); font-weight:500; }
.k-art { display:block; font-size:10.5px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:var(--text-leise); margin-bottom:1px; }
.k-meta { display:block; font-size:12px; color:var(--text-leise); margin-top:3px; }
.k-meta:empty { display:none; }
.k-meta .ueber { color:var(--warnung); font-weight:600; }
.k-notiz { display:none; font-size:12.5px; color:var(--text-leise); margin-top:6px; padding-top:6px; border-top:1px solid var(--rand); }
[data-stufe="detail"] .k-notiz { display:block; }
/* Statuspunkt: klicken schaltet weiter */
.k-punkt { position:absolute; left:4px; top:50%; width:26px; height:26px; margin-top:-13px; padding:0; border:0; background:none; cursor:pointer; }
.k-punkt::before { content:""; position:absolute; left:7px; top:7px; width:12px; height:12px; border-radius:50%; border:2px solid var(--rand-stark); box-sizing:border-box; }
.k[data-status="laeuft"] .k-punkt::before { background:var(--marke); border-color:var(--marke); }
.k[data-status="wartet"] .k-punkt::before { border-color:var(--wartend); border-style:dashed; }
.k[data-status="erledigt"] .k-punkt::before { background:var(--gut); border-color:var(--gut); }
.k[data-status="erledigt"] .k-punkt::after { content:""; position:absolute; left:11px; top:9px; width:3px; height:6px; border:solid var(--flaeche); border-width:0 2px 2px 0; transform:rotate(45deg); }
/* Läuft: ein ruhiger Puls statt eines Schattens */
.k[data-status="laeuft"]::after { content:""; position:absolute; inset:-2px; border:2px solid var(--marke); border-radius:2px; animation:puls 2.6s ease-out infinite; pointer-events:none; }
@keyframes puls { 0% { opacity:.55; transform:scale(1); } 100% { opacity:0; transform:scale(1.06,1.22); } }
/* Als Nächstes frei: das Kupfer ist die Handlung */
.k.frei::before { content:"Als Nächstes"; position:absolute; left:-2px; bottom:100%; margin-bottom:3px; font-size:10px; font-weight:700; letter-spacing:.07em; text-transform:uppercase; color:var(--akzent); white-space:nowrap; }
/* Verbindungsgriff */
.k-griff { position:absolute; right:-9px; top:50%; width:16px; height:16px; margin-top:-8px; border-radius:50%; background:var(--flaeche); border:2px solid var(--akzent); cursor:crosshair; opacity:0; transition:opacity .15s, transform .15s; }
.k-griff::after { content:""; position:absolute; inset:-12px; }
.k:hover .k-griff, .k.gewaehlt .k-griff { opacity:1; }
.k-griff:hover { transform:scale(1.25); }
.k.gewaehlt, .hub.gewaehlt { outline:2px solid var(--akzent); outline-offset:4px; }
.k.ziel { outline:3px dashed var(--akzent); outline-offset:4px; }
.k.gezogen, .hub.gezogen { pointer-events:none; opacity:.85; }
.leise { opacity:.18 !important; }
.k.neu { animation:geboren .5s cubic-bezier(.2,1.4,.4,1); }
@keyframes geboren { from { transform:translate(-50%,-50%) scale(.5); opacity:0; } }
[data-stufe="lage"] .k { opacity:0; pointer-events:none; }

/* Schwebende Werkzeugleisten */
.schwebe { position:absolute; z-index:5; display:flex; gap:8px; flex-wrap:wrap; align-items:flex-start; }
.oben { left:12px; right:12px; top:12px; }
.unten { left:12px; bottom:12px; }
.gruppe { display:flex; background:var(--flaeche); border:1px solid var(--rand); border-radius:2px; }
.gruppe > button { min-height:var(--griff); min-width:var(--griff); padding:0 13px; border:0; border-right:1px solid var(--rand); background:none; cursor:pointer; font-size:13px; font-weight:500; color:var(--text-leise); white-space:nowrap; }
.gruppe > button:last-child { border-right:0; }
.gruppe > button:hover { color:var(--text); background:var(--flaeche-leise); }
.gruppe > button[aria-pressed="true"] { background:var(--akzent-hell); color:var(--akzent); font-weight:600; box-shadow:inset 0 -2px 0 var(--akzent); }
.fang { flex:1 1 280px; max-width:460px; display:flex; background:var(--flaeche); border:1px solid var(--rand); border-radius:2px; }
.fang:focus-within { border-color:var(--akzent); }
.fang span { display:grid; place-items:center; width:40px; color:var(--akzent); font-size:20px; font-weight:500; }
.fang input { flex:1; min-width:0; min-height:var(--griff); border:0; background:none; font-size:16px; outline:none; padding-right:12px; }
.fang input::placeholder { color:var(--text-sehr-leise); }

.klein { position:absolute; z-index:5; right:12px; bottom:12px; width:188px; height:124px; background:var(--flaeche); border:1px solid var(--rand); border-radius:2px; cursor:pointer; overflow:hidden; }
.klein svg { width:100%; height:100%; display:block; }
.klein .fenster { fill:var(--akzent); fill-opacity:.06; stroke:var(--akzent); stroke-width:1.5; vector-effect:non-scaling-stroke; }

.meldung { position:absolute; z-index:6; left:50%; top:72px; transform:translate(-50%,-8px); padding:10px 14px; background:var(--text); color:var(--grund); border-radius:2px; font-size:13px; opacity:0; transition:opacity .2s, transform .2s; pointer-events:none; }
.meldung.an { opacity:1; transform:translate(-50%,0); }

/* Seitenspalte: Lage oder Bearbeiten */
.seite { background:var(--flaeche); border-left:1px solid var(--rand); overflow:auto; min-height:0; }
.seite-griff { display:none; }
.seite-inhalt { padding:18px 18px 28px; }
.seite h2 { margin:0; font-size:18px; font-weight:600; letter-spacing:-.02em; display:flex; align-items:baseline; gap:10px; }
.seite h2 .zahl { margin-left:auto; font-size:12px; font-weight:500; color:var(--text-sehr-leise); }
.seite h3 { margin:22px 0 8px; font-size:11px; font-weight:700; letter-spacing:.07em; text-transform:uppercase; color:var(--text-leise); display:flex; gap:8px; align-items:center; }
.seite h3 .zahl { font-weight:500; color:var(--text-sehr-leise); letter-spacing:0; }
.seite h3::after { content:""; flex:1; height:1px; background:var(--rand); }
.griffe { margin-top:28px; display:grid; grid-template-columns:auto 1fr; gap:7px 10px; font-size:12px; color:var(--text-sehr-leise); align-items:center; }
.griffe kbd { justify-self:start; }
.leer-satz { margin:0; font-size:13px; color:var(--text-sehr-leise); }

.themenzeile { display:grid; grid-template-columns:12px 1fr auto; gap:4px 10px; align-items:center; width:100%; min-height:var(--griff); padding:6px 0; border:0; border-bottom:1px solid var(--rand); background:none; text-align:left; cursor:pointer; }
.themenzeile:hover .tn { color:var(--akzent); }
.themenzeile .farbe { width:12px; height:12px; background:var(--t); }
.themenzeile .tn { font-weight:600; font-size:13.5px; }
.themenzeile .zahl { color:var(--text-sehr-leise); font-size:12px; }
.themenzeile .balken { grid-column:2 / 4; display:flex; gap:2px; height:5px; }
.themenzeile .balken i { flex:1; background:var(--flaeche-leise); border:1px solid var(--rand); }
.themenzeile .balken i[data-s="laeuft"] { background:var(--marke); border-color:var(--marke); }
.themenzeile .balken i[data-s="wartet"] { border:1px dashed var(--wartend); background:var(--wartend-hell); }
.themenzeile .balken i[data-s="erledigt"] { background:var(--gut); border-color:var(--gut); }

.posten { display:block; width:100%; min-height:var(--griff); margin:0 0 6px; padding:7px 10px 8px 12px; text-align:left; background:var(--f); border:0; border-left:4px solid var(--t); border-radius:2px; cursor:pointer; }
.posten:hover { outline:1px solid var(--t); }
.posten-titel { display:block; font-weight:600; font-size:13.5px; }
.posten-unter { display:block; font-size:12px; color:var(--text-leise); margin-top:1px; }
.posten-unter .ueber { color:var(--warnung); font-weight:600; }

.zurueck { min-height:var(--griff); padding:0 10px 0 0; border:0; background:none; color:var(--text-leise); cursor:pointer; font-size:13px; }
.zurueck:hover { color:var(--akzent); }
.feld { margin-top:16px; }
.feld > label, .feld > .etikett { display:block; font-size:12px; font-weight:600; color:var(--text-leise); margin-bottom:6px; }
.eingabe { width:100%; min-height:var(--griff); padding:9px 11px; font-size:16px; border:1px solid var(--rand-stark); border-radius:2px; background:var(--flaeche); outline:none; }
.eingabe:focus { border-color:var(--akzent); }
textarea.eingabe { resize:vertical; line-height:1.4; }
.i-titel { font-weight:600; font-size:17px; }
.seg { display:flex; border:1px solid var(--rand-stark); border-radius:2px; }
.seg button { flex:1; min-height:var(--griff); border:0; border-right:1px solid var(--rand); background:var(--flaeche); cursor:pointer; font-size:13px; font-weight:500; color:var(--text-leise); padding:0 4px; }
.seg button:last-child { border-right:0; }
.seg button[aria-pressed="true"] { color:var(--text); font-weight:600; box-shadow:inset 0 -3px 0 var(--s, var(--akzent)); }
.seg [data-status="offen"] { --s:var(--rand-stark); } .seg [data-status="laeuft"] { --s:var(--marke); }
.seg [data-status="wartet"] { --s:var(--wartend); } .seg [data-status="erledigt"] { --s:var(--gut); }
.chips { display:flex; flex-wrap:wrap; gap:6px; }
.chip { min-height:36px; padding:0 10px; border:1px solid var(--rand); background:var(--f, var(--flaeche)); border-radius:2px; cursor:pointer; font-size:12.5px; font-weight:500; display:inline-flex; align-items:center; gap:6px; }
.chip::before { content:""; width:8px; height:8px; background:var(--t, var(--rand-stark)); }
.chip[aria-pressed="true"] { border-color:var(--t, var(--text)); box-shadow:inset 0 0 0 1px var(--t, var(--text)); font-weight:700; }
.farbwahl { display:flex; gap:6px; flex-wrap:wrap; }
.farbwahl button { width:var(--griff); height:36px; border:2px solid transparent; background:var(--t); border-radius:2px; cursor:pointer; }
.farbwahl button[aria-pressed="true"] { border-color:var(--text); outline:2px solid var(--flaeche); outline-offset:-4px; }
.bezug { list-style:none; margin:0; padding:0; }
.bezug li { display:flex; align-items:center; gap:8px; min-height:40px; border-bottom:1px solid var(--rand); font-size:13px; }
.bezug li i { flex:0 0 8px; height:8px; background:var(--t, var(--rand-stark)); }
.bezug li span { flex:1; }
.bezug li button { min-width:40px; min-height:40px; border:0; background:none; color:var(--text-sehr-leise); cursor:pointer; font-size:18px; }
.bezug li button:hover { color:var(--warnung); }
.bezug select { margin-top:6px; }
.aktionen { display:flex; gap:8px; margin-top:22px; flex-wrap:wrap; }
.knopf { min-height:var(--griff); padding:0 14px; border:1px solid var(--rand-stark); background:var(--flaeche); border-radius:2px; cursor:pointer; font-size:13.5px; font-weight:500; display:inline-flex; align-items:center; gap:8px; }
.knopf.haupt { background:var(--akzent); border-color:var(--akzent); color:var(--auf-akzent); font-weight:600; }
.knopf.haupt kbd { background:none; border-color:currentColor; color:inherit; opacity:.8; }
.knopf.still { border-color:transparent; color:var(--text-leise); }
.knopf.gefahr { color:var(--warnung); border-color:var(--warnung); }

<div class="app" id="app" data-ansicht="stern" data-stufe="lage">

</div>

<script>
(() => {
"use strict";
const $ = s => document.querySelector(s);
const app = $("#app"), buehne = $("#buehne"), welt = $("#welt"), linien = $("#linien"),
  schicht = $("#knoten"), baender = $("#baender"), raster = $("#raster"),
  seite = $("#seite"), inhalt = $("#seite-inhalt"), klein = $("#klein");
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const HEUTE = new Date(); HEUTE.setHours(0, 0, 0, 0);
const STATUS = [["offen", "Offen"], ["laeuft", "Läuft"], ["wartet", "Wartet"], ["erledigt", "Erledigt"]];
const SCHLUESSEL = "lagekarte-entwurf-2";

/* ---------------------------------------------------------------- Daten */

function beispiel() {
  return {
    themen: [
      { id: "gr", name: "Gründung", farbe: 1, x: -420, y: -160 },
      { id: "pr", name: "Praktikantinnen", farbe: 2, x: -300, y: -470 },
      { id: "an", name: "Pilotpatient Andy", farbe: 3, x: 440, y: -200 },
      { id: "bu", name: "Wohnung & Büro", farbe: 4, x: -420, y: 250 },
      { id: "av", name: "AVS Pilottest", farbe: 6, x: 440, y: 230 },
    ],
    knoten: [
      { id: "gv", thema: "gr", titel: "Gesellschaftervertrag", status: "laeuft", x: -700, y: -300 },
      { id: "ko", thema: "gr", titel: "Konto eröffnen", status: "offen", notiz: "Mit dem Gesellschaftervertrag zur Bank.", x: -950, y: -300 },
      { id: "tb", thema: "gr", titel: "Termin Bank finden", status: "offen", x: -1200, y: -300 },
      { id: "ub", thema: "gr", titel: "Unterzeichnung Bank", status: "offen", x: -1450, y: -300 },
      { id: "sy", thema: "gr", titel: "Syndikatsvertrag", status: "offen", notiz: "Läuft parallel, hängt an nichts.", x: -720, y: -120 },
      { id: "kf", thema: "pr", titel: "Kandidatinnen finden", status: "laeuft", x: -600, y: -620 },
      { id: "tf", thema: "pr", titel: "Themen finden", status: "offen", x: -850, y: -620 },
      { id: "ffg", thema: "pr", titel: "Bewerbung FFG", status: "offen", x: -1450, y: -620 },
      { id: "ffr", thema: "pr", titel: "Rückmeldung FFG", status: "offen", x: -1700, y: -620 },
      { id: "za", thema: "an", titel: "Z-Achse", status: "wartet", notiz: "Lieferung ausständig.", x: 720, y: -300 },
      { id: "zb", thema: "an", titel: "Zusammenbau", status: "offen", x: 970, y: -300 },

      { id: "gz", thema: "bu", titel: "Graz anmieten", status: "offen", frist: "2027-01-31", x: -700, y: 150 },
      { id: "vi", thema: "bu", titel: "In Villach bleiben", status: "offen", frist: "2027-01-31", x: -700, y: 350 },
      { id: "spg", thema: "bu", titel: "SPG-Entscheidung", art: "entscheidung", status: "wartet", notiz: "Zusage → Büro im SPG, Absage → eigene Flächen.", x: -960, y: 250 },
      { id: "bs", thema: "bu", titel: "Büro im SPG", status: "offen", x: -1220, y: 150 },
      { id: "eb", thema: "bu", titel: "Eigene Büroflächen suchen", status: "offen", x: -1220, y: 350 },
      { id: "avs", thema: "av", titel: "Unterlagen ausarbeiten", status: "laeuft", frist: "2026-11-03", x: 720, y: 230 },
      { id: "avt", thema: "av", titel: "Termin AVS", art: "termin", status: "offen", frist: "2026-11-03", x: 970, y: 230 },
    ],
    kanten: [
      { von: "gv", nach: "ko" }, { von: "ko", nach: "tb" }, { von: "tb", nach: "ub" },
      { von: "kf", nach: "tf" }, { von: "tf", nach: "ffg" }, { von: "ub", nach: "ffg", text: "Gründung fertig" }, { von: "ffg", nach: "ffr" },
      { von: "za", nach: "zb", text: "wenn geliefert" }, { von: "zb", nach: "te" }, { von: "te", nach: "al" },
      { von: "gz", nach: "spg" }, { von: "vi", nach: "spg" },
      { von: "spg", nach: "bs", text: "Zusage" }, { von: "spg", nach: "eb", text: "Absage" },
      { von: "avs", nach: "avt" },
    ],
  };
}
function lade() { try { const t = localStorage.getItem(SCHLUESSEL); return t ? JSON.parse(t) : null; } catch (e) { return null; } }
function sichere() { try { localStorage.setItem(SCHLUESSEL, JSON.stringify(D)); } catch (e) { /* ohne Speicher geht's auch */ } }
let D = lade() || beispiel();

const K = id => D.knoten.find(n => n.id === id);
const T = id => D.themen.find(t => t.id === id);
const istHub = id => id.startsWith("t:");
const hubVon = n => n.thema ? "t:" + n.thema : "mitte";
const vor = id => D.kanten.filter(k => k.nach === id).map(k => k.von);
const nach = id => D.kanten.filter(k => k.von === id).map(k => k.nach);
const neueId = () => Math.random().toString(36).slice(2, 8);

/* Abgeleitet, nicht gespeichert: gesperrt, frei, wartet auf ein anderes Thema */
const gesperrt = n => n.status === "offen" && vor(n.id).some(v => K(v).status !== "erledigt");
const frei = n => n.status === "offen" && !gesperrt(n);
const kreuzSperre = n => vor(n.id).map(K).filter(v => v.status !== "erledigt" && v.thema !== n.thema);

function tageBis(iso) { const [y, m, d] = iso.split("-").map(Number); return Math.round((new Date(y, m - 1, d) - HEUTE) / 864e5); }
function fristText(iso) {
  const [y, m, d] = iso.split("-"); const t = tageBis(iso);
  const datum = `${d}.${m}.` + (Number(y) !== HEUTE.getFullYear() ? y.slice(2) : "");
  const rel = t < 0 ? `<span class="ueber">${-t} T drüber</span>` : t === 0 ? "heute" : `in ${t} T`;
  return `<span class="zahl">${datum}</span> · ${rel}`;
}
const nachFrist = (a, b) => (a.frist || "9999").localeCompare(b.frist || "9999");

/* ------------------------------------------------------ Ansicht & Lage */

let ansicht = innerWidth < 760 ? "straenge" : "stern";
let stufe = "lage", sel = null, schwebt = null, modus = null;
const cam = { x: 0, y: 0, k: .3 }; let camZiel = null;
const cur = {}, groesse = {}, elById = {};
let B = { pos: {}, lage: {}, baender: [] };
let dirty = true;

/* Stränge: Spalte = längster Weg über alle Abhängigkeiten. Dadurch rückt
   „Bewerbung FFG“ hinter „Unterzeichnung Bank“, und die Lücke im Strang der
   Praktikantinnen zeigt von selbst, dass dort gewartet wird. */
function rechneB() {
  const tiefe = {};
  const t = id => { if (tiefe[id] != null) return tiefe[id]; tiefe[id] = 0; const v = vor(id); return tiefe[id] = v.length ? Math.max(...v.map(x => t(x) + 1)) : 0; };
  D.knoten.forEach(n => t(n.id));
  const spuren = D.themen.map(x => x.id); if (D.knoten.some(n => !n.thema)) spuren.push(null);
  const SP = 300, ST = 84;
  const zeilen = spuren.map(s => {
    const g = {}; D.knoten.filter(n => (n.thema || null) === s).forEach(n => (g[tiefe[n.id]] ||= []).push(n));
    const m = Math.max(1, ...Object.values(g).map(a => a.length));
    return { s, g, h: Math.max(150, m * ST + 60) };
  });
  const gesamt = zeilen.reduce((a, b) => a + b.h, 0);
  let y = -gesamt / 2, maxX = 0; const pos = {}, band = [];
  zeilen.forEach(({ s, g, h }) => {
    const my = y + h / 2;
    Object.entries(g).forEach(([d, arr]) => arr.forEach((n, i) => { const x = Number(d) * SP; maxX = Math.max(maxX, x); pos[n.id] = { x, y: my + (i - (arr.length - 1) / 2) * ST }; }));
    if (s) pos["t:" + s] = { x: -300, y: my };
    band.push({ s, y, h }); y += h;
  });
  pos.mitte = { x: -640, y: 0 };
  const lage = { mitte: { x: -380, y: 0 } };
  D.themen.forEach((th, i) => lage["t:" + th.id] = { x: 0, y: (i - (D.themen.length - 1) / 2) * 200 });
  B = { pos, lage, baender: band.map(b => ({ ...b, x0: -440, x1: maxX + 170 })) };
}

function alleIds() { return ["mitte", ...D.themen.map(t => "t:" + t.id), ...D.knoten.map(n => n.id)]; }
function grundPos(id) {
  if (ansicht === "straenge") return B.pos[id] || { x: 0, y: 0 };
  if (id === "mitte") return { x: 0, y: 0 };
  const o = istHub(id) ? T(id.slice(2)) : K(id);
  return { x: o.x, y: o.y };
}
/* In der Lage bleibt das Bild unter k = 0,5 gleich groß: die Themen rücken
   auseinander und wachsen mit, statt zu Briefmarken zu schrumpfen. */
let lageM = .5; // Bildmaß der Lage: Bildschirmpunkte je Welteinheit; am Handy kleiner
const lageF = () => Math.max(1, lageM / cam.k);
const lageG = () => clamp(1.6 * lageM / cam.k, 1, 4);
function zielPos(id) {
  if (stufe !== "lage") return grundPos(id);
  if (id !== "mitte" && !istHub(id)) return zielPos(hubVon(K(id)));
  const p = ansicht === "straenge" ? B.lage[id] : grundPos(id), f = lageF();
  return { x: p.x * f, y: p.y * f };
}
function skal(id) {
  if (id === "mitte" || istHub(id)) return stufe === "lage" ? lageG() : clamp(.8 / cam.k, 1, 1.35);
  return 1;
}

/* ------------------------------------------------------------- Aufbau */

const farbStil = th => { const t = th && T(th); return t ? `--f:var(--f${t.farbe});--t:var(--t${t.farbe})` : "--f:var(--flaeche);--t:var(--text-sehr-leise)"; };

function hubHtml(t) {
  const ns = D.knoten.filter(n => n.thema === t.id);
  const fertig = ns.filter(n => n.status === "erledigt").length;
  const zeilen = [
    ...ns.filter(n => n.status === "laeuft").map(n => `<li data-s="laeuft">${esc(n.titel)}</li>`),
    ...ns.filter(n => n.status === "wartet").map(n => `<li data-s="wartet">wartet: ${esc(n.titel)}</li>`),
  ];
  const auf = [...new Set(ns.filter(n => n.status === "offen").flatMap(kreuzSperre).map(v => v.thema))];
  auf.forEach(a => zeilen.push(`<li data-s="kreuz">wartet auf ${esc(T(a)?.name)}</li>`));
  if (!zeilen.length) zeilen.push(`<li class="leer">${ns.length ? "nichts in Bewegung" : "noch leer"}</li>`);
  return `<div class="hub-kopf"><span class="hub-name">${esc(t.name)}</span><span class="hub-zahl">${fertig}/${ns.length}</span></div>
    <div class="hub-balken">${ns.map(n => `<i data-s="${n.status}"></i>`).join("")}</div>
    <ul class="hub-lage">${zeilen.slice(0, 4).join("")}</ul>`;
}
function knotenHtml(n) {
  const meta = [];
  if (n.frist) meta.push(fristText(n.frist));
  const ks = n.status === "offen" ? kreuzSperre(n) : [];
  if (ks.length) meta.push(`hängt an <b>${esc(T(ks[0].thema)?.name || "")}</b>`);
  const art = n.art === "entscheidung" ? "Entscheidung" : n.art === "termin" ? "Termin" : "";
  return `<button class="k-punkt" aria-label="Status weiterschalten" title="${STATUS.find(s => s[0] === n.status)[1]} — klicken schaltet weiter"></button>
    ${art ? `<span class="k-art">${art}</span>` : ""}<span class="k-titel">${esc(n.titel)}</span>
    <span class="k-meta">${meta.join(" · ")}</span>${n.notiz ? `<span class="k-notiz">${esc(n.notiz)}</span>` : ""}
    <span class="k-griff" title="Ziehen, um zu verbinden"></span>`;
}
function baue() {
  schicht.innerHTML = ""; for (const k in elById) delete elById[k];
  const neu = (id, cls, html, stil) => { const e = document.createElement("div"); e.className = cls; e.dataset.id = id; if (stil) e.setAttribute("style", stil); e.innerHTML = html; schicht.append(e); elById[id] = e; return e; };
  const lose = D.knoten.filter(n => !n.thema).length;
  neu("mitte", "mitte", `<img src="../../statisch/favicon.svg" alt=""><span>Sopharmis${lose ? `<small>${lose} lose ${lose === 1 ? "Gedanke" : "Gedanken"}</small>` : ""}</span>`);
  D.themen.forEach(t => neu("t:" + t.id, "hub", hubHtml(t), farbStil(t.id)));
  D.knoten.forEach(n => {
    const e = neu(n.id, "k", knotenHtml(n), farbStil(n.thema));
    e.dataset.status = n.status;
    if (gesperrt(n)) e.classList.add("gesperrt");
    if (frei(n)) e.classList.add("frei");
  });
  baender.innerHTML = B.baender.map(b => `<div class="band" style="left:${b.x0}px;top:${b.y}px;width:${b.x1 - b.x0}px;height:${b.h}px;${farbStil(b.s)}">${b.s ? "" : "<span>Ohne Thema</span>"}</div>`).join("");
  alleIds().forEach(id => { if (!cur[id]) cur[id] = { ...zielPos(id) }; });
  messen(); dirty = true;
}
function messen() { for (const id in elById) groesse[id] = { w: elById[id].offsetWidth, h: elById[id].offsetHeight }; }
function aktualisiere(ohneSeite) { rechneB(); baue(); if (!ohneSeite) zeigeSeite(); sichere(); }

/* ----------------------------------------------------------- Zeichnen */

function randPunkt(id, ux, uy) {
  const c = cur[id], g = groesse[id] || { w: 10, h: 10 }, s = skal(id);
  const hw = g.w * s / 2 + 5, hh = g.h * s / 2 + 5;
  const t = Math.min(ux ? hw / Math.abs(ux) : 1e9, uy ? hh / Math.abs(uy) : 1e9);
  return { x: c.x + ux * t, y: c.y + uy * t };
}
function linienListe() {
  const L = D.themen.map(t => ({ a: "mitte", b: "t:" + t.id, art: "stamm", t: t.farbe }));
  if (stufe === "lage") {
    const paare = new Map();
    D.kanten.forEach(k => { const a = K(k.von), b = K(k.nach);
      if (a.thema && b.thema && a.thema !== b.thema && a.status !== "erledigt") paare.set(a.thema + ">" + b.thema, { a: "t:" + a.thema, b: "t:" + b.thema, art: "kreuz", pfeil: true, text: "hält auf" }); });
    return L.concat([...paare.values()]);
  }
  D.knoten.forEach(n => { if (!vor(n.id).some(v => K(v).thema === n.thema)) L.push({ a: hubVon(n), b: n.id, art: "ast", t: n.thema ? T(n.thema).farbe : 0 }); });
  D.kanten.forEach(k => { const a = K(k.von), b = K(k.nach);
    L.push({ a: k.von, b: k.nach, art: a.status === "erledigt" ? "erfuellt" : a.thema !== b.thema ? "kreuz" : "folgt", text: k.text, pfeil: true }); });
  return L;
}
function pfad(L, fokus) {
  const A = cur[L.a], Z = cur[L.b]; if (!A || !Z) return "";
  const dx = Z.x - A.x, dy = Z.y - A.y, len = Math.hypot(dx, dy); if (len < 30) return "";
  let p1, p2, c1, c2, mid, tan;
  const gA = groesse[L.a], gZ = groesse[L.b];
  const horiz = ansicht === "straenge" && gA && gZ && (Z.x - gZ.w * skal(L.b) / 2) - (A.x + gA.w * skal(L.a) / 2) > 40;
  if (horiz) { // Stränge: waagrechte Tangenten, wie ein Gleisplan
    p1 = { x: A.x + gA.w * skal(L.a) / 2 + 4, y: A.y }; p2 = { x: Z.x - gZ.w * skal(L.b) / 2 - 6, y: Z.y };
    const h = (p2.x - p1.x) / 2; c1 = { x: p1.x + h, y: p1.y }; c2 = { x: p2.x - h, y: p2.y };
    mid = { x: .125 * p1.x + .375 * c1.x + .375 * c2.x + .125 * p2.x, y: .125 * p1.y + .375 * c1.y + .375 * c2.y + .125 * p2.y };
    tan = { x: 1, y: 0 };
  } else {
    const ux = dx / len, uy = dy / len;
    p1 = randPunkt(L.a, ux, uy); p2 = randPunkt(L.b, -ux, -uy);
    const b = (L.art === "stamm" || L.art === "ast") ? 0 : Math.hypot(p2.x - p1.x, p2.y - p1.y) * .08;
    c1 = { x: (p1.x + p2.x) / 2 - uy * b, y: (p1.y + p2.y) / 2 + ux * b };
    mid = { x: .25 * p1.x + .5 * c1.x + .25 * p2.x, y: .25 * p1.y + .5 * c1.y + .25 * p2.y };
    const tx = p2.x - c1.x, ty = p2.y - c1.y, tl = Math.hypot(tx, ty) || 1; tan = { x: tx / tl, y: ty / tl };
  }

    <div class="feld"><textarea class="eingabe i-titel" rows="2" data-feld="titel" aria-label="Titel">${esc(n.titel)}</textarea></div>
    <div class="feld"><span class="etikett">Status</span><div class="seg">${STATUS.map(([s, t]) => `<button data-status="${s}" aria-pressed="${n.status === s}">${t}</button>`).join("")}</div></div>
    <div class="feld"><span class="etikett">Thema</span><div class="chips">${D.themen.map(t => `<button class="chip" data-thema-setzen="${t.id}" style="${farbStil(t.id)}" aria-pressed="${n.thema === t.id}">${esc(t.name)}</button>`).join("")}<button class="chip" data-thema-setzen="" aria-pressed="${!n.thema}">lose</button></div></div>
    <div class="feld"><span class="etikett">Art</span><div class="seg">${[["", "Schritt"], ["entscheidung", "Entscheidung"], ["termin", "Termin"]].map(([a, t]) => `<button data-art-setzen="${a}" aria-pressed="${(n.art || "") === a}">${t}</button>`).join("")}</div></div>
    <div class="feld"><label for="i-frist">Frist</label><input id="i-frist" class="eingabe" type="date" data-feld="frist" value="${n.frist || ""}"></div>
    <div class="feld"><label for="i-notiz">Notiz</label><textarea id="i-notiz" class="eingabe" rows="3" data-feld="notiz">${esc(n.notiz || "")}</textarea></div>
    <div class="feld"><span class="etikett">Hängt an</span><ul class="bezug">${bez(vor(n.id), true)}</ul>${auswahl("vor-neu", "+ hängt an …")}</div>
    <div class="feld"><span class="etikett">Danach</span><ul class="bezug">${bez(nach(n.id), false)}</ul>${auswahl("nach-neu", "+ danach kommt …")}</div>
    <div class="aktionen"><button class="knopf haupt" data-akt="weiter">Nächster Schritt <kbd>Tab</kbd></button><button class="knopf still" data-akt="loeschen">Löschen …</button></div>
    <div id="nachfrage"></div>`;
}
function seiteThema(t) {
  const ns = D.knoten.filter(n => n.thema === t.id);
  inhalt.innerHTML = `<button class="zurueck" data-akt="zurueck">‹ Lage</button>
    <div class="feld"><textarea class="eingabe i-titel" rows="1" data-feld="name" aria-label="Name des Themas" placeholder="Name des Themas">${esc(t.name)}</textarea></div>
    <div class="feld"><span class="etikett">Farbe</span><div class="farbwahl">${[1, 2, 3, 4, 5, 6, 7, 8].map(f => `<button data-farbe="${f}" style="--t:var(--t${f})" aria-pressed="${t.farbe === f}" aria-label="Farbe ${f}"></button>`).join("")}</div></div>
    <h3>Schritte <span class="zahl">${ns.length}</span></h3>
    ${ns.length ? ns.map(n => posten(n, STATUS.find(s => s[0] === n.status)[1] + (n.frist ? " · " + fristText(n.frist) : ""))).join("") : `<p class="leer-satz">Noch kein Schritt. <kbd>Tab</kbd> legt den ersten an.</p>`}
    <div class="aktionen"><button class="knopf haupt" data-akt="weiter">Schritt <kbd>Tab</kbd></button><button class="knopf still" data-akt="loeschen">Auflösen …</button></div>
    <div id="nachfrage"></div>`;
}
function nachfrage() {
  const hub = istHub(sel), o = hub ? T(sel.slice(2)) : K(sel);
  $("#nachfrage").innerHTML = hub
    ? `<div class="nachfrage"><p>Thema „${esc(o.name)}“ auflösen? Die Schritte bleiben als lose Gedanken um die Mitte liegen.</p><div class="aktionen"><button class="knopf gefahr" data-akt="weg-ja">Auflösen</button><button class="knopf still" data-akt="weg-nein">Behalten</button></div></div>`
    : `<div class="nachfrage"><p>„${esc(o.titel)}“ löschen? Milder: als erledigt führen — dann bleibt sichtbar, dass es gemacht wurde.</p><div class="aktionen"><button class="knopf haupt" data-akt="erledigt">Als erledigt führen</button><button class="knopf gefahr" data-akt="weg-ja">Löschen</button></div></div>`;
}

inhalt.addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.geh) { const id = b.dataset.geh; sel = id; zeigeSeite(); fliegeZu(id, Math.max(cam.k, .85)); return; }
  if (b.dataset.themaFokus) return themaFokus("t:" + b.dataset.themaFokus);
  if (b.dataset.status) { K(sel).status = b.dataset.status; return aktualisiere(); }
  if (b.dataset.themaSetzen != null) return ordneZu(sel, b.dataset.themaSetzen ? "t:" + b.dataset.themaSetzen : "mitte");
  if (b.dataset.artSetzen != null) { K(sel).art = b.dataset.artSetzen || undefined; return aktualisiere(); }
  if (b.dataset.farbe) { T(sel.slice(2)).farbe = Number(b.dataset.farbe); return aktualisiere(); }
  if (b.dataset.weg) { const [v, n] = b.dataset.weg.split(">"); D.kanten = D.kanten.filter(k => !(k.von === v && k.nach === n)); return aktualisiere(); }
  const akt = b.dataset.akt;
  if (akt === "zurueck") { sel = null; zeigeSeite(); dirty = true; }
  else if (akt === "weiter") naechsterSchritt(sel);
  else if (akt === "loeschen") nachfrage();
  else if (akt === "weg-nein") $("#nachfrage").innerHTML = "";
  else if (akt === "weg-ja") entferne(sel);
  else if (akt === "erledigt") { K(sel).status = "erledigt"; aktualisiere(); }
});
inhalt.addEventListener("input", e => {
  const f = e.target.dataset.feld; if (!f || !sel) return;
  const o = istHub(sel) ? T(sel.slice(2)) : K(sel);
  o[f] = e.target.value || (f === "titel" || f === "name" ? "" : undefined);
  const aktiv = document.activeElement;
  aktualisiere(true); // Seitenspalte bleibt stehen, sonst springt der Cursor
  aktiv?.focus();
});
inhalt.addEventListener("change", e => {
  const a = e.target.dataset.akt; if (!a || !e.target.value) return;
  if (a === "vor-neu") verbinde(e.target.value, sel); else verbinde(sel, e.target.value);
  zeigeSeite();
});
$("#seite-griff").addEventListener("click", () => seite.classList.toggle("offen"));

/* ------------------------------------------------------------ Zeiger */

const zeiger = new Map();
buehne.addEventListener("pointerdown", e => {
  if (e.target.closest(".schwebe, .klein") || e.target.isContentEditable) return;
  if (e.pointerType === "mouse" && e.button !== 0) return;
  buehne.setPointerCapture(e.pointerId);
  zeiger.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (zeiger.size === 2) {
    const [a, b] = [...zeiger.values()];
    document.querySelectorAll(".gezogen").forEach(x => x.classList.remove("gezogen"));
    modus = { art: "pinch", d: Math.hypot(a.x - b.x, a.y - b.y), mx: (a.x + b.x) / 2, my: (a.y + b.y) / 2 }; return;
  }
  camZiel = null;
  const id = e.target.closest("[data-id]")?.dataset.id;
  if (id && e.target.closest(".k-griff")) { modus = { art: "verbinden", von: id, x0: e.clientX, y0: e.clientY }; return; }
  if (id && id !== "mitte") {
    const hub = istHub(id), o = hub ? T(id.slice(2)) : K(id);
    modus = { art: "knoten", id, x0: e.clientX, y0: e.clientY, bewegt: false, punkt: !!e.target.closest(".k-punkt"),
      start: { x: o.x, y: o.y, kinder: hub ? D.knoten.filter(n => n.thema === o.id).map(n => [n, n.x, n.y]) : [] } };
    return;
  }
  modus = { art: "pan", x0: e.clientX, y0: e.clientY, cx: cam.x, cy: cam.y, bewegt: false };
  buehne.classList.add("zieht");
});
buehne.addEventListener("pointermove", e => {
  if (!zeiger.has(e.pointerId)) {
    const h = e.target.closest?.(".k")?.dataset.id || null;
    if (h !== schwebt) { schwebt = h; dirty = true; }
    return;
  }
  zeiger.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (!modus) return;
  const r = flaeche();
  if (modus.art === "pinch") {
    if (zeiger.size < 2) return;
    const [a, b] = [...zeiger.values()], d = Math.hypot(a.x - b.x, a.y - b.y), mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
    zoomUm(mx - r.left, my - r.top, d / modus.d); cam.x += mx - modus.mx; cam.y += my - modus.my;
    Object.assign(modus, { d, mx, my }); return;
  }
  const dx = e.clientX - modus.x0, dy = e.clientY - modus.y0;
  if (!modus.bewegt && Math.hypot(dx, dy) > 4) modus.bewegt = true;
  if (!modus.bewegt) return;
  if (modus.art === "knoten" && ansicht !== "stern") { // in den Strängen ordnet die Karte selbst — ziehen schwenkt
    modus = { art: "pan", x0: e.clientX, y0: e.clientY, cx: cam.x, cy: cam.y, bewegt: true }; buehne.classList.add("zieht"); return;
  }
  if (modus.art === "pan") { cam.x = modus.cx + dx; cam.y = modus.cy + dy; dirty = true; }
  else if (modus.art === "knoten") {
    const wx = dx / cam.k, wy = dy / cam.k, { id, start } = modus, hub = istHub(id), o = hub ? T(id.slice(2)) : K(id);
    o.x = Math.round(start.x + wx); o.y = Math.round(start.y + wy);
    start.kinder.forEach(([n, x, y]) => { n.x = Math.round(x + wx); n.y = Math.round(y + wy); cur[n.id] = zielPos(n.id); });
    cur[id] = zielPos(id);
    if (!hub) {
      elById[id].classList.add("gezogen");
      const u = document.elementFromPoint(e.clientX, e.clientY)?.closest(".hub, .mitte");
      document.querySelectorAll(".ziel").forEach(x => x !== u && x.classList.remove("ziel"));
      u?.classList.add("ziel"); modus.ziel = u?.dataset.id;
    }
    dirty = true;
  } else if (modus.art === "verbinden") {
    modus.px = (e.clientX - r.left - cam.x) / cam.k; modus.py = (e.clientY - r.top - cam.y) / cam.k;
    const u = document.elementFromPoint(e.clientX, e.clientY)?.closest(".k");
    const z = u && u.dataset.id !== modus.von ? u.dataset.id : null;
    document.querySelectorAll(".k.ziel").forEach(x => x.dataset.id !== z && x.classList.remove("ziel"));
    if (z) elById[z].classList.add("ziel");
    modus.ziel = z; dirty = true;
  }
});
function zeigerEnde(e) {
  zeiger.delete(e.pointerId); buehne.classList.remove("zieht");
  const m = modus; if (!m) return; modus = null;
  document.querySelectorAll(".ziel, .gezogen").forEach(x => x.classList.remove("ziel", "gezogen"));
  if (m.art === "pan" && !m.bewegt) waehle(null);
  else if (m.art === "knoten") {
    if (!m.bewegt) { if (m.punkt) statusWeiter(m.id); else if (istHub(m.id) && stufe === "lage") themaFokus(m.id); else waehle(m.id); }
    else if (!istHub(m.id) && m.ziel) ordneZu(m.id, m.ziel);
    else sichere();
  } else if (m.art === "verbinden" && m.ziel) verbinde(m.von, m.ziel);
  dirty = true;
}
buehne.addEventListener("pointerup", zeigerEnde);
buehne.addEventListener("pointercancel", zeigerEnde);
buehne.addEventListener("dblclick", e => {
  if (e.target.closest(".schwebe, .klein")) return;
  const id = e.target.closest("[data-id]")?.dataset.id;
  if (id && id !== "mitte") return bearbeite(id);
  if (ansicht !== "stern") return neuerKnoten({});
  const r = flaeche(), p = { x: Math.round((e.clientX - r.left - cam.x) / cam.k), y: Math.round((e.clientY - r.top - cam.y) / cam.k) };
  if (stufe === "lage") return neuerKnoten({});
  // Das nächste Thema in Reichweite nimmt den Gedanken auf; sonst bleibt er lose.
  let th = null, best = 700;
  D.themen.forEach(t => { const d = Math.hypot(t.x - p.x, t.y - p.y); if (d < best) { best = d; th = t.id; } });
  neuerKnoten({ thema: th, bei: p });
});
buehne.addEventListener("wheel", e => {
  e.preventDefault(); camZiel = null;
  const r = flaeche();
  // Mausrad (ganze Rasten, nur senkrecht) zoomt; Trackpad schwenkt, Kneifen zoomt.
  const rad = e.deltaMode === 1 || (e.deltaX === 0 && Number.isInteger(e.deltaY) && Math.abs(e.deltaY) >= 50);
  if (e.ctrlKey || e.metaKey) zoomUm(e.clientX - r.left, e.clientY - r.top, Math.exp(-e.deltaY * .01));
  else if (rad) zoomUm(e.clientX - r.left, e.clientY - r.top, Math.exp(-e.deltaY * .0016));
  else { cam.x -= e.deltaX; cam.y -= e.deltaY; dirty = true; }
}, { passive: false });
klein.addEventListener("pointerdown", e => {
  if (!kleinMass) return;
  const rr = klein.getBoundingClientRect(), m = kleinMass;
  const wx = (e.clientX - rr.left - m.ox) / m.s + m.x0, wy = (e.clientY - rr.top - m.oy) / m.s + m.y0;
  const r = flaeche(); camZiel = { k: cam.k, x: r.width / 2 - wx * cam.k, y: r.height / 2 - wy * cam.k };
});

/* ----------------------------------------------------------- Tastatur */

document.addEventListener("keydown", e => {
  if (e.target.closest?.("input, textarea, select, [contenteditable='true']")) return;
  if (e.key === "Tab") { e.preventDefault(); naechsterSchritt(sel); }
  else if (e.key === "Enter" && sel) { e.preventDefault(); bearbeite(sel); }
  else if (e.key === " " && sel && !istHub(sel)) { e.preventDefault(); statusWeiter(sel); }
  else if ((e.key === "Backspace" || e.key === "Delete") && sel) { e.preventDefault(); nachfrage(); }
  else if (e.key === "Escape") { sel = null; zeigeSeite(); dirty = true; }
  else if (e.key === "1") zurLage(); else if (e.key === "2") zurKarte(); else if (e.key === "3") detail();
  else if (e.key === "+" || e.key === "=") zoomMitte(1.25); else if (e.key === "-") zoomMitte(.8);
});
function zoomMitte(f) { const r = flaeche(); const z = { ...cam }; const k2 = clamp(cam.k * f, .12, 2.4); camZiel = { k: k2, x: r.width / 2 - (r.width / 2 - z.x) * (k2 / z.k), y: r.height / 2 - (r.height / 2 - z.y) * (k2 / z.k) }; }
function detail() { if (sel) fliegeZu(sel, 1.3); else zoomMitte(1.3 / cam.k); }

/* ------------------------------------------------------ Werkzeugleiste */

function knoepfe() {
  document.querySelectorAll("[data-ansicht]").forEach(b => b.getAttribute("aria-pressed") != null && b.setAttribute("aria-pressed", b.dataset.ansicht === ansicht));
  document.querySelectorAll(".unten [data-stufe]").forEach(b => b.setAttribute("aria-pressed", b.dataset.stufe === stufe));
}
document.querySelectorAll("button[data-ansicht]").forEach(b => b.addEventListener("click", () => {
  if (ansicht === b.dataset.ansicht) return;
  ansicht = b.dataset.ansicht; app.dataset.ansicht = ansicht; knoepfe();
  // Die Knoten fliegen von ihrem alten an den neuen Platz; die Kamera folgt.
  if (stufe === "lage") zurLage(); else if (sel) fliegeZu(sel); else blende(alleIds(), .62, 1, 60);
  dirty = true;
}));
document.querySelectorAll(".unten [data-stufe]").forEach(b => b.addEventListener("click", () => ({ lage: zurLage, karte: zurKarte, detail })[b.dataset.stufe]()));
$("#weg").onclick = () => zoomMitte(.8); $("#hin").onclick = () => zoomMitte(1.25);
$("#neues-thema").onclick = neuesThema;
$("#fang").addEventListener("keydown", e => {
  if (e.key !== "Enter") return;
  let text = e.target.value.trim(); if (!text) return;
  let th = null;
  const m = text.match(/^([^:]{2,40}):\s*(.+)$/);
  if (m) { const t = D.themen.find(t => t.name.toLowerCase().startsWith(m[1].trim().toLowerCase())); if (t) { th = t.id; text = m[2]; } }
  e.target.value = "";
  const n = neuerKnoten({ titel: text, thema: th, bearbeiten: false });
  melde(th ? `In „${T(th).name}“ abgelegt` : "Als loser Gedanke um die Mitte gelegt");
  sel = n.id; zeigeSeite();
});
const themaKnopf = $("#thema-knopf");
function setzeThema(t) { document.documentElement.dataset.thema = t; themaKnopf.textContent = t === "dunkel" ? "Hell" : "Dunkel"; dirty = true; }
themaKnopf.onclick = () => setzeThema(document.documentElement.dataset.thema === "dunkel" ? "hell" : "dunkel");
$("#zuruecksetzen").onclick = () => { D = beispiel(); sel = null; for (const k in cur) delete cur[k]; aktualisiere(); zurLage(); };
addEventListener("resize", () => { dirty = true; });

/* ------------------------------------------------------------- Start */

setzeThema(matchMedia("(prefers-color-scheme: dark)").matches ? "dunkel" : "hell");
app.dataset.ansicht = ansicht; knoepfe();
rechneB(); baue(); zeigeSeite();
// Anflug: erst weit draußen, dann gleitet die Lage herein.
zurLage(true); const ziel = { ...cam }; cam.k = ziel.k * .55; const r0 = flaeche();
cam.x = r0.width / 2 - (r0.width / 2 - ziel.x) * .55; cam.y = r0.height / 2 - (r0.height / 2 - ziel.y) * .55; camZiel = ziel;
for (const id of alleIds()) cur[id] = { ...zielPos(id) };
requestAnimationFrame(takt);
})();
</script>
</body>
</html>
