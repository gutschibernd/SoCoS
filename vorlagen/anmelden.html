<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Anmelden · SoCoS</title>
<!--
  Feste Pfade statt des static-Tags: Die Ablage für statische Dateien arbeitet
  mit einem Manifest, und das kennt eine Datei erst nach `collectstatic`.
  Genau diese Seite muss aber stehen, bevor irgendetwas gebaut ist — sonst
  antwortet die Anmeldung mit einem Fehler statt mit einem Formular.
  Dieselben Pfade stehen in frontend/index.html.
-->
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml" />
<link rel="alternate icon" href="/static/favicon.ico" sizes="48x48 32x32 16x16" />
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet" />
<style>
/*
 * Zweite Kopie der Palette aus frontend/src/stil/farben.css.
 *
 * Diese Seite läuft **ohne** das React-Bundle — sie muss stehen, bevor
 * irgendetwas geladen ist. Die Namen sind hier bewusst dieselben, damit
 * jemand, der eine Farbe ändert, diese zweite Stelle findet.
 */
:root {
  color-scheme: light;
  --grund: #EFEDE6;
  --flaeche: #FFFFFF;
  --rand: #DFDBD1;
  --rand-stark: #C9C4B7;
  --text: #16272B;
  --text-leise: #5A6668;
  --marke: #14595F;
  --marke-dunkel: #0F4448;
  --marke-rand: #A8C6C4;
  --auf-marke: #FFFFFF;
  /* Die Wortmarke. Hier steht sie groß und zweifarbig; die Kopfleiste der
     Anwendung setzt dieselbe Marke klein und einfarbig. */
  --wortmarke: #0F4448;
  --wortmarke-o: #8A5638;
  --warnung: #9C4229;
  --warnung-hell: #F7E6DF;
  --kante: 2px;
  --griff: 44px;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --grund: #12191A;
    --flaeche: #1A2325;
    --rand: #2C393B;
    --rand-stark: #3D4D50;
    --text: #E6E9E6;
    --text-leise: #9AA8AA;
    --marke: #5EA8A8;
    --marke-dunkel: #0F4448;
    --marke-rand: #3A6B6C;
    --auf-marke: #0B2224;
    /* Dunkel trägt das Grün der Wortmarke nicht — auf #1A2325 kommt #0F4448
       auf 1,2:1 und ist schlicht nicht da. Die Marke steht dann in Textfarbe. */
    --wortmarke: #E6E9E6;
    --wortmarke-o: #C88A63;
    --warnung: #D98A6D;
    --warnung-hell: #33211C;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  background: var(--grund);
  color: var(--text);
  font-family: Figtree, system-ui, sans-serif;
  font-size: 15px;
  -webkit-font-smoothing: antialiased;
  padding: max(20px, env(safe-area-inset-top)) 20px max(20px, env(safe-area-inset-bottom));
}
.karte {
  width: 100%;
  max-width: 380px;
  background: var(--flaeche);
  border: 1px solid var(--rand);
  border-radius: var(--kante);
  border-top: 3px solid var(--marke);
  padding: 28px 26px 26px;
}
/*
 * Die Wortmarke, groß und zweifarbig: die beiden kleinen o im Kupfer der
 * Palette. Damit entziffert sich das Kürzel selbst — **So**pharmis
 * **Co**ntrolling **S**oftware.
 *
 * Das Signet ist als Bild eingebunden, nicht nachgezeichnet: Die Geometrie
 * steht einmal in skripte/symbole.py, und dieselbe Datei ist das Favicon.
 * Ein zweites Mal gezeichnet wäre sie beim ersten Nachbessern falsch.
 */
.marke { display: flex; align-items: center; gap: 13px; margin-bottom: 26px; }
.marke img { display: block; border-radius: var(--kante); }
/* 57 px ist keine runde Zahl, sondern eine gemessene: Bei dieser Größe ist die
   Wortmarke genau so breit wie die Mono-Zeile darunter (je ~169 px). Das ist
   die Bauregel des Sopharmis-Logos — beide Zeilen auf eine Breite gezogen. */
.marke .wort {
  font-size: 57px; font-weight: 700; letter-spacing: -0.025em; line-height: 1;
  color: var(--wortmarke);
}
.marke .wort i { font-style: normal; color: var(--wortmarke-o); }
.marke .unter {
  margin-top: 7px;
  font-family: "IBM Plex Mono", ui-monospace, monospace;
  font-size: 7.5px; font-weight: 500; letter-spacing: 0.15em; text-transform: uppercase;
  color: var(--text-leise);
}
label { display: block; font-size: 13px; font-weight: 600; margin: 0 0 6px; }
input[type=email], input[type=text], input[type=password] {
  width: 100%;
  /* 16 px, sonst zoomt iOS beim Hineintippen. */
  font: inherit; font-size: 16px;
  min-height: var(--griff);
  padding: 10px 12px;
  margin-bottom: 16px;
  color: var(--text);
  background: var(--flaeche);
  border: 1px solid var(--rand-stark);
  border-radius: var(--kante);
}
input:focus-visible { outline: 2px solid var(--marke-rand); outline-offset: 1px; }
button {
  width: 100%;
  min-height: var(--griff);
  font: inherit; font-size: 16px; font-weight: 600;
  color: var(--auf-marke); background: var(--marke);
  border: 0; border-radius: var(--kante);
  cursor: pointer;
}
button:hover { filter: brightness(0.92); }
.fehler {
  background: var(--warnung-hell);
  color: var(--warnung);
  border-radius: var(--kante);
  padding: 11px 13px;
  margin-bottom: 18px;
  font-size: 14px;
}
.hinweis { margin: 18px 0 0; font-size: 13px; color: var(--text-leise); line-height: 1.5; }
</style>
</head>
<body>
<main class="karte">
  <div class="marke">
    <img src="/static/favicon.svg" alt="" width="46" height="46" />
    <div>
      <div class="wort">S<i>o</i>C<i>o</i>S</div>
      <div class="unter">Sopharmis Controlling Software</div>
    </div>
  </div>

  {% if form.errors %}
    <div class="fehler" role="alert">
      E-Mail oder Passwort stimmen nicht.
      <br />Nach fünf Fehlversuchen ist das Konto für eine Stunde gesperrt.
    </div>
  {% endif %}

  <form method="post" novalidate>
    {% csrf_token %}
    <label for="id_username">E-Mail</label>
    <input type="email" name="username" id="id_username" autocomplete="username"
           autocapitalize="none" autocorrect="off" required autofocus
           value="{{ form.username.value|default:'' }}" />

    <label for="id_password">Passwort</label>
    <input type="password" name="password" id="id_password"
           autocomplete="current-password" required />

    <button type="submit">Anmelden</button>
    <input type="hidden" name="next" value="{{ next }}" />
  </form>

  <p class="hinweis">
    Es gibt keine Selbstanmeldung. Konten legt ein Administrator an.
  </p>
</main>
</body>
</html>
